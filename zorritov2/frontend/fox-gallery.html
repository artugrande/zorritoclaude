<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Zorros — Zorrito V2</title>
  <link rel="icon" type="image/png" href="assets/zorritofinallogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery-hero { text-align:center; padding:28px 20px 16px; }
    .gallery-hero h1 { font-size:1.4rem; font-weight:800; }
    .gallery-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
    @media(min-width:480px) { .gallery-grid { grid-template-columns:repeat(3, 1fr); } }
    .fox-card { background:var(--surface); border:1.5px solid var(--border); border-radius:16px; overflow:hidden; }
    .fox-card img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
    .fox-card-info { padding:8px 10px; }
    .fox-wallet { font-family:monospace; font-size:0.7rem; color:var(--muted); }
    .fox-traits { font-size:0.75rem; color:var(--muted); margin-top:2px; }
    .empty-state { text-align:center; color:var(--muted); font-size:0.9rem; padding:60px 20px; grid-column:1/-1; }
    .skel { background:#f0f0f0; animation:skeleton 1.4s ease-in-out infinite; border-radius:16px; aspect-ratio:1; }
    @keyframes skeleton { 0%,100%{opacity:.4} 50%{opacity:1} }
    .count-badge { font-size:0.8rem; color:var(--muted); text-align:center; margin-bottom:12px; }
  </style>

</head>
<body class="docs-page">

  <header>
    <div class="logo">
      <img src="assets/zorritofinallogo.png" alt="Zorrito" class="logo-fox" />
      <span>Zorr<span>ito</span> <span style="font-size:0.65em;opacity:0.8;">V2</span></span>
    </div>
    <p class="header-tagline">Ahorrá USDT. Ganá un premio semanal.</p>
    <div class="nav-links">
      <a href="docs.html" style="font-size:0.8rem;color:var(--muted);text-decoration:none;padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-weight:600;">📖 Docs</a>
      <a href="stats.html" style="font-size:0.8rem;color:var(--muted);text-decoration:none;padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-weight:600;">📊 Stats</a>
      <a href="index.html" style="font-size:0.8rem;color:var(--green);text-decoration:none;padding:6px 12px;border:1px solid rgba(26,153,96,0.3);border-radius:8px;font-weight:700;">← App</a>
    </div>
  </header>

  <div style="display:flex;justify-content:center;width:100%;">
  <div style="width:100%;max-width:620px;padding:0 20px 40px;box-sizing:border-box;">

  <div class="gallery-hero">
    <div style="font-size:48px;margin-bottom:6px;">🦊</div>
    <h1>Galería de Zorros</h1>
    <p style="color:var(--muted);font-size:0.88rem;margin-top:4px;">Todos los zorros generados por la comunidad de Zorrito V2</p>
  </div>

  <div class="count-badge" id="gallery-count"></div>

  <div class="gallery-grid" id="gallery-grid">
    <div class="skel"></div>
    <div class="skel"></div>
    <div class="skel"></div>
  </div>

  </div>
  </div>

  <script>
    const TRAIT_LABELS = {
      fur:        { orange:"🟠", red:"🔴", white:"⬜", brown:"🟤", black:"🖤" },
      accessory:  { sunglasses:"🕶️", cowboy:"🤠", scarf:"🧣", chain:"🔗", mate:"🧉", worldcup:"🏆", none:"" },
      background: { jungle:"🌿", city:"🏙️", beach:"🏖️", space:"🌌", patagonia:"🏔️", desert:"🌵", stadium:"🏟️" },
      expression: { happy:"😊", cool:"😎", powerful:"💪", mysterious:"🔮" },
      jersey:     {
        none:"", argentina:"🇦🇷", brazil:"🇧🇷", france:"🇫🇷", spain:"🇪🇸",
        germany:"🇩🇪", england:"🏴󠁧󠁢󠁥󠁮󠁧󠁿", italy:"🇮🇹", portugal:"🇵🇹",
        netherlands:"🇳🇱", uruguay:"🇺🇾", colombia:"🇨🇴", chile:"🇨🇱",
        mexico:"🇲🇽", usa:"🇺🇸", japan:"🇯🇵", australia:"🇦🇺",
        senegal:"🇸🇳", morocco:"🇲🇦", nigeria:"🇳🇬", "south-korea":"🇰🇷",
      },
    };

    function fmtWallet(w) {
      return w ? `${w.slice(0,6)}...${w.slice(-4)}` : "—";
    }

    function traitEmojis(traits) {
      if (!traits) return "";
      return [
        TRAIT_LABELS.fur[traits.fur]               || "",
        TRAIT_LABELS.accessory[traits.accessory]   || "",
        TRAIT_LABELS.background[traits.background] || "",
        TRAIT_LABELS.expression[traits.expression] || "",
        traits.jersey ? (TRAIT_LABELS.jersey[traits.jersey] || "") : "",
      ].filter(Boolean).join(" ");
    }

    async function loadGallery() {
      const grid  = document.getElementById("gallery-grid");
      const count = document.getElementById("gallery-count");

      try {
        const resp = await fetch("/api/fox-gallery");
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const { gallery } = await resp.json();

        grid.innerHTML = "";

        if (!gallery || gallery.length === 0) {
          grid.innerHTML = `<div class="empty-state">
            <div style="font-size:3rem;margin-bottom:12px;">🦊</div>
            <div>Todavía no hay zorros generados.<br>
            <a href="index.html" style="color:var(--orange);font-weight:700;">¡Sé el primero!</a></div>
          </div>`;
          return;
        }

        count.textContent = `${gallery.length} zorro${gallery.length !== 1 ? "s" : ""} generado${gallery.length !== 1 ? "s" : ""}`;

        for (const entry of gallery) {
          const card = document.createElement("div");
          card.className = "fox-card";
          const emojis = traitEmojis(entry.traits);
          card.innerHTML = `
            <img src="${entry.imageUrl}?t=${entry.timestamp || 0}" alt="Zorro de ${fmtWallet(entry.wallet)}" loading="lazy">
            <div class="fox-card-info">
              <a href="https://celoscan.io/address/${entry.wallet}" target="_blank" rel="noopener"
                 style="text-decoration:none;">
                <div class="fox-wallet">${fmtWallet(entry.wallet)}</div>
              </a>
              ${emojis ? `<div class="fox-traits">${emojis}</div>` : ""}
            </div>`;
          grid.appendChild(card);
        }
      } catch (err) {
        grid.innerHTML = `<div class="empty-state">
          <div style="font-size:2rem;margin-bottom:8px;">⚠️</div>
          <div>Error cargando galería:<br>${err.message}</div>
        </div>`;
      }
    }

    loadGallery();
  </script>
</body>
</html>
