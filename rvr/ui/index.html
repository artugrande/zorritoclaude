<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaxy RVR — Control</title>
<style>
  :root {
    --bg: #0e1013; --panel: #171b21; --line: #262c35; --text: #e6e9ee;
    --dim: #8b95a3; --accent: #5aa9e6; --ok: #4ec9a0; --warn: #e8b84b; --bad: #e0614f;
    --manual: #5aa9e6; --auto: #4ec9a0; --teach: #c07de8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif;
    display: grid; grid-template-columns: 1fr 380px; grid-template-rows: auto 1fr;
    height: 100vh; overflow: hidden;
  }
  header {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .modes { display: flex; gap: 6px; }
  .modes button {
    background: #0e1116; color: var(--dim); border: 1px solid var(--line);
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .modes button[data-active="true"] { color: #0e1013; }
  .modes button[data-mode="manual"][data-active="true"] { background: var(--manual); border-color: var(--manual); }
  .modes button[data-mode="auto"][data-active="true"]   { background: var(--auto);   border-color: var(--auto); }
  .modes button[data-mode="teach"][data-active="true"]  { background: var(--teach);  border-color: var(--teach); }
  .spacer { flex: 1; }
  .pill { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  .dot[data-on="true"] { background: var(--ok); }
  #estop {
    background: var(--bad); color: #fff; border: none; padding: 8px 20px;
    border-radius: 6px; font-weight: 700; cursor: pointer; letter-spacing: .5px;
  }
  main { padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
  .video { position: relative; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .video img { width: 100%; display: block; aspect-ratio: 4/3; object-fit: contain; }
  .hud {
    position: absolute; left: 10px; bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap;
  }
  .hud span {
    background: rgba(8,10,13,.78); border: 1px solid var(--line); color: var(--text);
    padding: 3px 9px; border-radius: 5px; font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .hud span[data-alert="true"] { border-color: var(--bad); color: var(--bad); }
  .veto {
    position: absolute; top: 10px; left: 10px; background: rgba(224,97,79,.92);
    padding: 4px 10px; border-radius: 5px; font-size: 12px; font-weight: 600; display: none;
  }
  .dpad { display: grid; grid-template-columns: repeat(3, 62px); gap: 6px; justify-content: center; }
  .dpad button {
    height: 52px; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; font-size: 19px; cursor: pointer; user-select: none;
  }
  .dpad button:active, .dpad button[data-held="true"] { background: var(--accent); color: #0e1013; }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type=text], textarea, select {
    flex: 1; background: #0b0e12; border: 1px solid var(--line); color: var(--text);
    padding: 9px 11px; border-radius: 6px; font: inherit; resize: vertical;
  }
  button.action {
    background: var(--accent); color: #0e1013; border: none; padding: 9px 16px;
    border-radius: 6px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--dim); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #mic { width: 46px; font-size: 17px; }
  #mic[data-listening="true"] { background: var(--bad); color: #fff; animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 14px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .9px; color: var(--dim);
       margin: 18px 0 8px; font-weight: 700; }
  h2:first-child { margin-top: 0; }
  .log { font-size: 12.5px; display: flex; flex-direction: column; gap: 5px; }
  .log div { padding: 5px 8px; border-radius: 5px; background: #12161b; border-left: 2px solid var(--line); }
  .log .agent    { border-left-color: var(--auto); }
  .log .takeover { border-left-color: var(--warn); color: var(--warn); }
  .log .finding  { border-left-color: var(--accent); }
  .log .error    { border-left-color: var(--bad); color: var(--bad); }
  .log .say      { border-left-color: var(--teach); font-style: italic; }
  .log time { color: var(--dim); margin-right: 6px; font-variant-numeric: tabular-nums; }
  .place, .finding-card {
    background: #12161b; border: 1px solid var(--line); border-radius: 7px;
    padding: 8px 10px; margin-bottom: 7px; font-size: 13px;
  }
  .place b { color: var(--teach); }
  .place p, .finding-card p { margin: 3px 0 0; color: var(--dim); font-size: 12px; }
  .finding-card img, .place img { width: 100%; border-radius: 5px; margin-top: 6px; }
  .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); }
  .empty { color: var(--dim); font-size: 12.5px; font-style: italic; }
  .hint { color: var(--dim); font-size: 12px; margin: 0; }
  kbd { background: #0b0e12; border: 1px solid var(--line); border-radius: 4px;
        padding: 1px 5px; font-size: 11px; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>Galaxy RVR</h1>
  <div class="modes">
    <button data-mode="manual">Manual</button>
    <button data-mode="auto">Auto</button>
    <button data-mode="teach">Teach</button>
  </div>
  <div class="spacer"></div>
  <div class="pill"><span class="dot" id="dot-rover"></span> rover</div>
  <div class="pill"><span class="dot" id="dot-cam"></span> camera</div>
  <div class="pill" id="llm-pill"></div>
  <div class="pill" id="agent-pill">idle</div>
  <button id="estop">STOP</button>
</header>

<main>
  <div class="video">
    <img id="video" src="/stream.mjpg" alt="rover camera">
    <div class="veto" id="veto"></div>
    <div class="hud">
      <span id="hud-dist">— cm</span>
      <span id="hud-ir">IR —</span>
      <span id="hud-batt">— V</span>
      <span id="hud-motors">L0 R0</span>
      <span id="hud-mode">manual</span>
    </div>
  </div>

  <div class="dpad">
    <div></div><button data-dir="forward">▲</button><div></div>
    <button data-dir="left">◀</button>
    <button data-dir="stop">■</button>
    <button data-dir="right">▶</button>
    <div></div><button data-dir="backward">▼</button><div></div>
  </div>
  <p class="hint" style="text-align:center">
    Hold <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or the arrow keys to drive ·
    <kbd>Space</kbd> stops · <kbd>Shift</kbd> for full speed ·
    driving while in Auto takes control from the agent
  </p>

  <div class="row">
    <button id="mic" class="action" title="Hold to speak">🎤</button>
    <input type="text" id="utterance" placeholder='Say or type anything — "explore the living room and tell me what looks out of place", "this is the kitchen", "go to the desk", "stop"'>
    <select id="lang" style="flex:0 0 120px">
      <option value="es-AR">Español</option>
      <option value="en-US">English</option>
      <option value="pt-BR">Português</option>
      <option value="fr-FR">Français</option>
    </select>
    <button class="action" id="send">Send</button>
  </div>
  <p class="hint" id="speech-note"></p>

  <div class="row">
    <input type="text" id="place-name" placeholder="Name this spot (Teach mode) — e.g. the kitchen">
    <button class="action" id="teach">Teach place</button>
    <button class="ghost action" id="abort">Abort mission</button>
  </div>
</main>

<aside>
  <h2>Activity</h2>
  <div class="log" id="log"></div>
  <h2>Places <span class="tag" id="place-count"></span></h2>
  <div id="places"><p class="empty">Nothing taught yet. Switch to Teach, drive somewhere, and name it.</p></div>
  <h2>Findings</h2>
  <div id="findings"><p class="empty">No findings yet.</p></div>
</aside>

<script>
const $ = id => document.getElementById(id);
let state = {}, ws = null, speaking = true;

// --- websocket ---------------------------------------------------------------
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => { logLine('error', 'Control link lost — reconnecting…'); setTimeout(connect, 1500); };
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
async function api(path, body, method = 'POST') {
  const res = await fetch('/api/' + path, {
    method, headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  return res.json().catch(() => ({}));
}

function handle(msg) {
  if (msg.kind === 'state') return render(msg.data);
  const d = msg.data || {};
  const at = new Date(msg.at * 1000).toLocaleTimeString();
  switch (msg.kind) {
    case 'agent':
      if (d.text) logLine('agent', d.text, at);
      else if (d.tool) logLine('agent', `→ ${d.tool}(${summarise(d.args)})`, at);
      else if (d.reason) logLine('agent', `${d.status}: ${d.reason}`, at);
      break;
    case 'takeover': logLine('takeover', `⚠ Takeover — ${d.reason}`, at); break;
    case 'say':      logLine('say', `🔊 ${d.text}`, at); speak(d.text, d.language); break;
    case 'finding':  logLine('finding', `★ [${d.importance}] ${d.text}`, at); addFinding(d); break;
    case 'place':    logLine('', `📍 Learned “${d.name}”`, at); loadPlaces(); break;
    case 'mission':  logLine('', d.text, at); break;
    case 'mode':     logLine('', `Mode → ${d.mode}${d.reason ? ' (' + d.reason + ')' : ''}`, at); break;
    case 'error':    logLine('error', d.text, at); break;
    case 'log':      logLine('', d.text, at); break;
  }
}
const summarise = a => !a ? '' : Object.entries(a).map(([k, v]) =>
  `${k}=${String(v).slice(0, 26)}`).join(', ').slice(0, 70);

function logLine(cls, text, at) {
  if (!text) return;
  const el = document.createElement('div');
  el.className = cls;
  el.innerHTML = `<time>${at || new Date().toLocaleTimeString()}</time>`;
  el.appendChild(document.createTextNode(text));
  $('log').prepend(el);
  while ($('log').children.length > 150) $('log').lastChild.remove();
}

// --- state rendering ---------------------------------------------------------
function render(s) {
  state = s;
  const r = s.rover || {};
  $('dot-rover').dataset.on = !!r.connected;
  $('dot-cam').dataset.on = !!r.camera;
  $('hud-mode').textContent = s.mode;
  $('hud-dist').textContent = r.distance_cm == null ? 'clear' : `${Math.round(r.distance_cm)} cm`;
  $('hud-dist').dataset.alert = r.distance_cm != null && r.distance_cm < 25;
  const ir = [r.ir_left && 'L', r.ir_right && 'R'].filter(Boolean).join('+');
  $('hud-ir').textContent = ir ? `IR ${ir}` : 'IR clear';
  $('hud-ir').dataset.alert = !!ir;
  $('hud-batt').textContent = r.battery_v == null ? '— V'
    : `${r.battery_v.toFixed(2)} V · ${Math.round(r.battery_pct)}%`;
  $('hud-batt').dataset.alert = r.battery_pct != null && r.battery_pct < 15;
  $('hud-motors').textContent = `L${r.motors?.left ?? 0} R${r.motors?.right ?? 0}`;

  $('veto').style.display = r.last_veto ? 'block' : 'none';
  $('veto').textContent = r.last_veto || '';

  document.querySelectorAll('.modes button').forEach(b =>
    b.dataset.active = (b.dataset.mode === s.mode));

  const pill = $('llm-pill');
  if (s.llm_available) {
    pill.innerHTML = `<span class="dot" data-on="true"></span> ${escape(s.llm_model)}`;
    pill.title = `via ${s.llm_endpoint}`;
    $('mic').disabled = !SR;
    $('utterance').placeholder = 'Say or type anything — "explore the living room and '
      + 'tell me what looks out of place", "this is the kitchen", "go to the desk", "stop"';
  } else {
    pill.innerHTML = '<span class="dot"></span> no API key';
    pill.title = 'Set ANTHROPIC_API_KEY (or AI_GATEWAY_API_KEY) and restart';
    $('mic').disabled = true;
    $('utterance').placeholder =
      'Voice and autonomy need an API key — set ANTHROPIC_API_KEY and restart. Driving works without it.';
  }
  $('send').disabled = !s.llm_available;
  $('teach').disabled = false;  // teaching still stores keyframes, just no written description

  const a = s.agent;
  $('agent-pill').textContent = !a || !a.running ? 'idle'
    : a.paused ? `paused · ${a.steps} steps`
    : `running · ${a.steps} steps · ${a.tokens_in + a.tokens_out} tok`;
  $('abort').disabled = !s.agent_running;
}

// --- driving -----------------------------------------------------------------
const held = new Set();
const KEYS = { w: 'f', arrowup: 'f', s: 'b', arrowdown: 'b',
               a: 'l', arrowleft: 'l', d: 'r', arrowright: 'r' };
let lastVector = null;

addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); estop(); return; }
  if (KEYS[k]) { e.preventDefault(); held.add(KEYS[k]); }
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (KEYS[k]) held.delete(KEYS[k]);
});
addEventListener('blur', () => { held.clear(); });

// Re-send at 10Hz. The rover stops on its own if we go quiet, so a dropped
// keyup or a closed laptop lid coasts to a halt rather than driving on.
setInterval(() => {
  const speed = shift ? 90 : 58;
  let l = 0, r = 0;
  if (held.has('f')) { l += speed; r += speed; }
  if (held.has('b')) { l -= speed; r -= speed; }
  if (held.has('l')) { l -= speed; r += speed; }
  if (held.has('r')) { l += speed; r -= speed; }
  l = Math.max(-100, Math.min(100, l));
  r = Math.max(-100, Math.min(100, r));
  const vector = `${l},${r}`;
  if (l === 0 && r === 0) {
    if (lastVector && lastVector !== '0,0') { send({ action: 'stop' }); lastVector = '0,0'; }
    return;
  }
  send({ action: 'drive', left: l, right: r, duration_ms: 300 });
  lastVector = vector;
}, 100);

let shift = false;
addEventListener('keydown', e => { if (e.key === 'Shift') shift = true; });
addEventListener('keyup', e => { if (e.key === 'Shift') shift = false; });

document.querySelectorAll('.dpad button').forEach(btn => {
  const dir = btn.dataset.dir;
  const map = { forward: 'f', backward: 'b', left: 'l', right: 'r' };
  const press = e => {
    e.preventDefault();
    if (dir === 'stop') return estop();
    held.add(map[dir]); btn.dataset.held = 'true';
  };
  const release = () => { held.delete(map[dir]); btn.dataset.held = 'false'; };
  btn.addEventListener('pointerdown', press);
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointerleave', release);
});

function estop() { held.clear(); send({ action: 'stop' }); api('stop'); }
$('estop').onclick = estop;

// --- modes, missions, teaching ----------------------------------------------
document.querySelectorAll('.modes button').forEach(b =>
  b.onclick = () => api('mode', { mode: b.dataset.mode }));
$('abort').onclick = () => api('abort');
$('teach').onclick = async () => {
  const name = $('place-name').value.trim();
  if (!name) return $('place-name').focus();
  $('teach').disabled = true;
  logLine('', `Teaching “${name}” — scanning…`);
  const res = await api('teach', { name });
  logLine(res.ok ? '' : 'error', res.detail || 'teach failed');
  $('place-name').value = '';
  $('teach').disabled = false;
};

$('send').onclick = submit;
$('utterance').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
async function submit() {
  const text = $('utterance').value.trim();
  if (!text) return;
  $('utterance').value = '';
  await api('utterance', { text });
}

// --- voice in and out --------------------------------------------------------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  $('mic').disabled = true;
  $('speech-note').textContent =
    'Speech recognition needs Chrome or Edge. Typing works everywhere, and does the same thing.';
} else {
  const recog = new SR();
  recog.continuous = false;
  recog.interimResults = true;
  let listening = false;

  $('mic').onclick = () => {
    if (listening) { recog.stop(); return; }
    recog.lang = $('lang').value;
    recog.start();
  };
  recog.onstart = () => { listening = true; $('mic').dataset.listening = 'true'; };
  recog.onend   = () => { listening = false; $('mic').dataset.listening = 'false'; };
  recog.onerror = e => {
    listening = false; $('mic').dataset.listening = 'false';
    logLine('error', `Microphone: ${e.error}`);
  };
  recog.onresult = e => {
    const result = e.results[e.results.length - 1];
    $('utterance').value = result[0].transcript;
    if (result.isFinal) submit();
  };
  $('speech-note').textContent =
    'Hit the mic and speak. “Stop” is matched locally and acts immediately, without waiting on the network.';
}

function speak(text, lang) {
  if (!speaking || !window.speechSynthesis || !text) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang && lang.length > 1 ? lang : $('lang').value;
  speechSynthesis.speak(u);
}

// --- side panels -------------------------------------------------------------
async function loadPlaces() {
  const { places = [] } = await fetch('/api/places').then(r => r.json());
  $('place-count').textContent = places.length ? `${places.length}` : '';
  $('places').innerHTML = places.length ? '' :
    '<p class="empty">Nothing taught yet. Switch to Teach, drive somewhere, and name it.</p>';
  for (const p of places) {
    const el = document.createElement('div');
    el.className = 'place';
    el.innerHTML = `<b>${escape(p.name)}</b> <span class="tag">${p.visits} visits</span>
      <p>${escape(p.description || 'no description')}</p>`;
    if (p.keyframes?.length) {
      const img = document.createElement('img');
      img.src = p.keyframes[p.keyframes.length - 1];
      el.appendChild(img);
    }
    $('places').appendChild(el);
  }
}
function addFinding(d) {
  if ($('findings').querySelector('.empty')) $('findings').innerHTML = '';
  const el = document.createElement('div');
  el.className = 'finding-card';
  el.innerHTML = `<span class="tag">${d.importance}</span><p>${escape(d.text)}</p>`;
  if (d.image) {
    const img = document.createElement('img');
    img.src = '/data/' + d.image;
    el.appendChild(img);
  }
  $('findings').prepend(el);
}
const escape = s => String(s ?? '').replace(/[<>&"]/g, c =>
  ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));

// Some browsers freeze an MJPEG <img> that was hidden; force a reload on return.
addEventListener('visibilitychange', () => {
  if (!document.hidden) $('video').src = '/stream.mjpg?t=' + Date.now();
});

connect();
loadPlaces();
</script>
</body>
</html>
