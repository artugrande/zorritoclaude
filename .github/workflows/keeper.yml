name: Zorrito Annual Draw Keeper

on:
  # Run at midnight UTC on Dec 31, Jan 1, and Jan 2 — safety net for the annual draw
  schedule:
    - cron: "0 0 31 12 *"   # Dec 31 00:00 UTC
    - cron: "0 0 1 1 *"     # Jan  1 00:00 UTC  ← main trigger
    - cron: "0 6 1 1 *"     # Jan  1 06:00 UTC  ← retry if midnight run fails
    - cron: "0 0 2 1 *"     # Jan  2 00:00 UTC  ← final fallback
  # Allow manual trigger from GitHub UI at any time
  workflow_dispatch:

jobs:
  draw:
    name: Try Annual Draw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run keeper
        env:
          PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
        run: node scripts/keeper.js --once
